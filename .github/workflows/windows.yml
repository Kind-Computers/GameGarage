name: Windows build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Audit, build, test, and package
        shell: powershell
        run: ./scripts/build.ps1 -Package
      - name: Verify installer lifecycle and portable distribution
        shell: powershell
        run: ./scripts/test-distributions.ps1
      - name: Upload distribution validation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distribution-validation
          path: artifacts/distribution-validation.json
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: GameGarage-win-x64
          path: |
            artifacts/GameGarage-*-win-x64-setup.exe
            artifacts/GameGarage-*-win-x64-portable.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
