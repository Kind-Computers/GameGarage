name: Publish Windows preview
on:
  push:
    tags: ['v0.1.0-preview.1']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'Kind-Computers/GameGarage'
    runs-on: windows-2022
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Require recorded acceptance evidence
        shell: powershell
        run: ./scripts/check-release-gate.ps1 -Tag $env:GITHUB_REF_NAME
      - name: Audit, build, test, and package
        shell: powershell
        run: ./scripts/build.ps1 -Package
      - name: Publish prerelease and checksums
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME artifacts/GameGarage-0.1.0-preview.1-win-x64.zip artifacts/SHA256SUMS.txt --verify-tag --prerelease --latest=false --title "Game Garage v0.1.0-preview.1" --notes-file docs/releases/v0.1.0-preview.1.md
          if ($LASTEXITCODE -ne 0) { throw 'GitHub prerelease publication failed.' }
