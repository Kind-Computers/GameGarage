name: Publish Windows beta
on:
  push:
    tags: ['v0.1']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'Kind-Computers/GameGarage'
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Require recorded acceptance evidence
        shell: powershell
        run: ./scripts/check-release-gate.ps1 -Tag $env:GITHUB_REF_NAME
      - name: Audit, build, test, and package
        shell: powershell
        run: ./scripts/build.ps1 -Package
      - name: Verify installer lifecycle and portable distribution
        shell: powershell
        run: ./scripts/test-distributions.ps1
      - name: Upload distribution validation report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: distribution-validation
          path: artifacts/distribution-validation.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Publish prerelease and checksums
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME artifacts/GameGarage-0.1-win-x64-setup.exe artifacts/GameGarage-0.1-win-x64-portable.zip artifacts/SHA256SUMS.txt --verify-tag --prerelease --latest=false --title "Game Garage 0.1 (Beta)" --notes-file docs/releases/v0.1.md
          if ($LASTEXITCODE -ne 0) { throw 'GitHub prerelease publication failed.' }
